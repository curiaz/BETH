services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bethbot
      POSTGRES_USER: bethbot
      POSTGRES_PASSWORD: bethbot_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bethbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      TRADING_MODE: paper
      EXCHANGE: binance
      PAPER_INITIAL_BALANCE: "10000"
      SUPPORTED_SYMBOLS: "BTC/USDT,ETH/USDT"
      DATABASE_URL: "postgresql+asyncpg://bethbot:bethbot_dev@db:5432/bethbot"
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:3000"
      DISCORD_WEBHOOK_URL: ""
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

volumes:
  pgdata:
