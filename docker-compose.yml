services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bethbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bethbot}
      POSTGRES_USER: ${POSTGRES_USER:-bethuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bethpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bethuser} -d ${POSTGRES_DB:-bethbot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API & Quantara Trading Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bethbot-backend
    restart: unless-stopped
    environment:
      TRADING_MODE: paper
      APP_ENV: development
      PAPER_INITIAL_BALANCE: "10000"
      SUPPORTED_SYMBOLS: "BTC/USDT,ETH/USDT"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bethuser}:${POSTGRES_PASSWORD:-bethpassword}@postgres:5432/${POSTGRES_DB:-bethbot}
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Next.js Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bethbot-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
